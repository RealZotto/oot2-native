#
# The content guard in CI. Changes to this file, to tools/ and to .githooks/ are
# reviewed by the code owners (.github/CODEOWNERS): a pull request can edit the
# guard that checks it, so the review of those paths is the real protection.
name: content-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    # A push that deletes a branch has no commit to check out.
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      # No "ref:" on purpose. A push checks out the pushed commit. A pull request
      # checks out the merge ref, which holds both the base and the head commit
      # (also for a fork), so BASE..HEAD below resolves with the full history.
      - name: Check out the full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check every commit of the push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch, or a force push whose old tip is gone, checks all history.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          echo "Checking range: $range"
          python tools/check_content.py --range "$range"

      - name: Check every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Checking range: $BASE..$HEAD"
          python tools/check_content.py --range "$BASE..$HEAD"

      - name: Check the whole tree
        run: python tools/check_content.py --all

      # The lifter (tools/lift) needs numpy, and its spin-wait search
      # (tools/lift/spin_waits.py) capstone, both pinned; they are the only packages
      # outside the standard library the tools use besides Ninja below.
      - name: Install the lifter's dependencies
        run: python -m pip install numpy==2.5.4 capstone==5.0.7

      # The build and link tests (tests/test_build_game.py) and the check step of
      # oot2 prepare run Ninja; its PyPI package, pinned, as in windows-build.yml.
      - name: Install Ninja
        run: |
          python -m pip install ninja==1.13.0
          ninja --version

      # The Vulkan headers, Volk and glslang the runtime builds with, at the pins of
      # tools/fetch_vulkan.py, laid out as a Vulkan SDK folder outside the checkout
      # (after the guard, which never sees them), as in windows-build.yml.
      - name: Cache the Vulkan headers, Volk and glslang
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulkan-kit
          key: vulkan-kit-${{ runner.os }}-${{ hashFiles('tools/fetch_vulkan.py') }}

      - name: Fetch the Vulkan headers, Volk and glslang
        run: |
          python tools/fetch_vulkan.py --dest "$RUNNER_TEMP/vulkan-kit"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-kit" >> "$GITHUB_ENV"

      # Dear ImGui at the pin of tools/fetch_imgui.py, laid out in the ignored folder fetched/imgui inside the
      # checkout, and the guard run again over the whole tree with it present (the run above had it absent): it is
      # ignored by .gitignore and blocked by the guard, so a file of it that got staged would be refused.
      - name: Fetch Dear ImGui
        run: python tools/fetch_imgui.py

      - name: Check the whole tree with Dear ImGui present
        run: |
          test -f fetched/imgui/imgui.cpp
          python tools/check_content.py --all

      # dav1d, the AV1 decoder of the movies, built C-only by tools/fetch_dav1d.py from its release archive (checked against
      # a pinned SHA-256) with the runner's clang. The pictures are the same as the assembly's, so the decoder tests mean
      # the same here as on Windows, where windows-build.yml builds the assembly too and requires the tests to run. This
      # step has not been run on a Linux runner when it was written: it must not stop the guard, so a failure leaves
      # the kit out and the decoder tests skip with their stated reason (no kit).
      - name: Cache the dav1d kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dav1d-kit
          key: dav1d-kit-${{ runner.os }}-${{ hashFiles('tools/fetch_dav1d.py') }}

      - name: Build dav1d
        continue-on-error: true
        run: |
          python tools/fetch_dav1d.py --no-asm --dest "$RUNNER_TEMP/dav1d-kit"
          echo "DAV1D_DIR=$RUNNER_TEMP/dav1d-kit" >> "$GITHUB_ENV"

      # libopus, the decoder behind the game's hardware Opus decoder, built by tools/fetch_opus.py from Xiph's release
      # archive (checked against a pinned SHA-256) with the runner's clang, in plain C: the same library as on Windows. This
      # step has not been run on a Linux runner when it was written: it must not stop the guard, so a failure leaves the kit
      # out and the decoder test skips with its stated reason (no kit).
      - name: Cache the libopus kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/opus-kit
          key: opus-kit-${{ runner.os }}-${{ hashFiles('tools/fetch_opus.py') }}

      - name: Build libopus
        continue-on-error: true
        run: |
          python tools/fetch_opus.py --dest "$RUNNER_TEMP/opus-kit"
          echo "OPUS_DIR=$RUNNER_TEMP/opus-kit" >> "$GITHUB_ENV"

      # SDL3, the window layer of the game (window, Vulkan surface, input), built by tools/fetch_sdl3.py from its release
      # archive (checked against a pinned SHA-256) with CMake, Ninja and the runner's clang. Not run on a runner when it was
      # written, and a Linux build needs the X11 or Wayland development packages, which the script checks for (it refuses
      # a build with no window driver): this step must not stop the guard, so a failure leaves the kit out and the tests that
      # need it skip with their stated reason (no kit).
      - name: Cache the SDL3 kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3-kit
          key: sdl3-kit-${{ runner.os }}-${{ hashFiles('tools/fetch_sdl3.py') }}

      - name: Build SDL3
        continue-on-error: true
        run: |
          python tools/fetch_sdl3.py --dest "$RUNNER_TEMP/sdl3-kit"
          echo "SDL3_DIR=$RUNNER_TEMP/sdl3-kit" >> "$GITHUB_ENV"

      # The runtime boundary and lifter tests build C with clang (preinstalled on the
      # runner, with the AArch64 assembler the lifter tests use); here a missing
      # compiler, Ninja, capstone, Vulkan SDK or Dear ImGui fails them instead of skipping them.
      # One module per process, up to four at a time, and the modules that assert a
      # wall-clock bound alone afterwards (tools/run_tests.py): the tests were nearly all
      # of the job on one core. The log ends with the usual Ran and OK lines.
      - name: Run the unit tests
        env:
          OOT2_REQUIRE_CLANG: "1"
          OOT2_REQUIRE_CAPSTONE: "1"
          OOT2_REQUIRE_VULKAN: "1"
          OOT2_REQUIRE_IMGUI: "1"
        run: |
          clang --version
          python tools/run_tests.py
