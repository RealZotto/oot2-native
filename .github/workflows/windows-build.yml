#
# The Windows build: the platform the program targets. It builds the shader
# translator (tools/build_xlate.py, NativeAOT) and runs the unit tests with
# llvm-mingw's clang, the toolchain the runtime is written for; the runtime,
# boundary and lifter tests compile runtime/core with it and run the result.
# The runtime compiles against the Vulkan headers and Volk and embeds shaders
# that glslang compiles, so tools/fetch_vulkan.py lays those out as a Vulkan SDK
# folder first. Every input is synthetic, assembled inside the tests. It cannot
# build the game.
#
# Windows minutes count double on a private repository: the downloads are
# cached, and a newer push to the same branch cancels the run it replaces (the
# newer tip contains the older commits, so it is the one worth testing).
name: windows-build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # A push that deletes a branch has no commit to check out.
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # The clang the author's machines use (22.1.8). The runner's own LLVM
      # targets MSVC, whose linker ignores -Wl,--disable-high-entropy-va, which
      # the memory tests need (runtime/core/memory.c, rt_mem_init).
      LLVM_MINGW_TAG: "20260616"
      LLVM_MINGW: llvm-mingw-20260616-ucrt-x86_64
      LLVM_MINGW_SHA256: b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      # No "ref:", as in content-guard.yml: a pull request checks out its merge ref.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 3.14, as on the development machines; content-guard.yml covers 3.12.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Cache the llvm-mingw archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\llvm-mingw-zip
          key: llvm-mingw-${{ env.LLVM_MINGW }}-${{ env.LLVM_MINGW_SHA256 }}

      # The archive is checked against the SHA-256 GitHub records for the release
      # asset, whether it was downloaded now or restored from the cache.
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'llvm-mingw-zip'
          $zip = Join-Path $dir "$env:LLVM_MINGW.zip"
          if (-not (Test-Path $zip)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            curl.exe -fsSL --retry 3 -o $zip "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_TAG/$env:LLVM_MINGW.zip"
            if ($LASTEXITCODE -ne 0) { throw "download failed" }
          }
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw archive has SHA-256 $got" }
          7z x -y -bso0 -bsp0 "-o$env:RUNNER_TEMP" $zip
          if ($LASTEXITCODE -ne 0) { throw "extraction failed" }
          Join-Path $env:RUNNER_TEMP "$env:LLVM_MINGW\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # A new runner image (a new .NET SDK or Visual Studio) rebuilds the translator.
      - name: Read the runner image version
        id: image
        shell: pwsh
        run: |
          $v = $env:ImageVersion
          if (-not $v) { $v = "unknown-$env:GITHUB_RUN_ID" }
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # The translator is rebuilt when its sources, its build script or the runner
      # image change; otherwise the build of the same inputs is reused, which saves
      # about a minute of a three-minute run.
      - name: Cache the translator
        id: xlate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build\xlate\publish
          key: xlate-${{ steps.image.outputs.version }}-${{ hashFiles('xlate/**', 'tools/build_xlate.py') }}

      - name: Cache NuGet packages
        if: steps.xlate.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('xlate/**/*.csproj', 'xlate/**/*.props', 'xlate/NuGet.config') }}
          restore-keys: nuget-${{ runner.os }}-

      # The runner's newest .NET 10 SDK and Visual Studio's linker.
      - name: Build the translator
        if: steps.xlate.outputs.cache-hit != 'true'
        run: python tools/build_xlate.py

      # The lifter's two dependencies outside the standard library, pinned: numpy, and
      # capstone for its spin-wait search.
      - name: Install the lifter's dependencies
        run: python -m pip install numpy==2.5.4 capstone==5.0.7

      # The build and link tests (tests/test_build_game.py) and the check step of
      # oot2 prepare run Ninja; llvm-mingw has none. Its PyPI package, pinned.
      - name: Install Ninja
        run: |
          python -m pip install ninja==1.13.0
          ninja --version

      # The Vulkan headers, Volk and glslang at the pins of tools/fetch_vulkan.py (the Vulkan SDK 1.4.357.0's headers
      # and Volk, fetched by commit; glslang's release archive checked against its SHA-256), laid out as a Vulkan SDK
      # folder that VULKAN_SDK names. The cache key is the script, which holds the pins; the script checks a restored
      # folder against the hashes it recorded.
      - name: Cache the Vulkan headers, Volk and glslang
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vulkan-kit
          key: vulkan-kit-${{ runner.os }}-${{ hashFiles('tools/fetch_vulkan.py') }}

      - name: Fetch the Vulkan headers, Volk and glslang
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'vulkan-kit'
          python tools/fetch_vulkan.py --dest $kit
          if ($LASTEXITCODE -ne 0) { throw "fetch_vulkan.py failed" }
          "VULKAN_SDK=$kit" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Dear ImGui at the pin of tools/fetch_imgui.py (version 1.92.9b, fetched by commit, every file checked against
      # its SHA-256), laid out in the ignored folder fetched/imgui, where tools/build_game.py and the tests find it.
      # The fetch takes seconds, so nothing is cached. The tests compile its four core sources into the runtime.
      - name: Fetch Dear ImGui
        run: python tools/fetch_imgui.py

      # dav1d, the AV1 decoder of the movies, built by tools/fetch_dav1d.py from its release archive (checked against a
      # pinned SHA-256) with llvm-mingw's clang and the pinned NASM 2.16.03 (also checked), laid out as a kit that
      # DAV1D_DIR names. The cache key is the script (which holds the pins and a hash of itself) and the compiler's tag; the
      # script checks a restored folder against the hashes it recorded. About a minute on a cache miss; both archives come from
      # their projects' own servers (VideoLAN, nasm.us), so an outage there fails this job on a cache miss.
      - name: Cache the dav1d kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\dav1d-kit
          key: dav1d-kit-${{ runner.os }}-${{ env.LLVM_MINGW }}-${{ hashFiles('tools/fetch_dav1d.py') }}

      - name: Build dav1d
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'dav1d-kit'
          python tools/fetch_dav1d.py --dest $kit
          if ($LASTEXITCODE -ne 0) { throw "fetch_dav1d.py failed" }
          "DAV1D_DIR=$kit" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # libopus, the decoder behind the game's hardware Opus decoder, built by tools/fetch_opus.py from Xiph's release archive
      # (checked against a pinned SHA-256) with llvm-mingw's clang and Ninja, in plain C, laid out as a kit that OPUS_DIR names.
      # The cache key is the script (which holds the pins and a hash of itself) and the compiler's tag; the script checks a
      # restored folder against the hashes it recorded. About half a minute on a cache miss; the archive comes from Xiph's own
      # server, so an outage there fails this job on a cache miss.
      - name: Cache the libopus kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\opus-kit
          key: opus-kit-${{ runner.os }}-${{ env.LLVM_MINGW }}-${{ hashFiles('tools/fetch_opus.py') }}

      - name: Build libopus
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'opus-kit'
          python tools/fetch_opus.py --dest $kit
          if ($LASTEXITCODE -ne 0) { throw "fetch_opus.py failed" }
          "OPUS_DIR=$kit" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # SDL3, the window layer of the game (window, Vulkan surface, input), built by tools/fetch_sdl3.py from its release
      # archive (checked against a pinned SHA-256) with llvm-mingw's clang, CMake and Ninja, laid out as a kit that
      # SDL3_DIR names. The cache key is the script (which holds the pins and a hash of itself) and the compiler's tag; the
      # script checks a restored folder against the hashes it recorded. A failure stops the job, and the tests that need
      # the kit fail instead of skipping (OOT2_REQUIRE_SDL3 below), as for dav1d and libopus.
      - name: Cache the SDL3 kit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\sdl3-kit
          key: sdl3-kit-${{ runner.os }}-${{ env.LLVM_MINGW }}-${{ hashFiles('tools/fetch_sdl3.py') }}

      - name: Build SDL3
        shell: pwsh
        run: |
          $kit = Join-Path $env:RUNNER_TEMP 'sdl3-kit'
          python tools/fetch_sdl3.py --dest $kit
          if ($LASTEXITCODE -ne 0) { throw "fetch_sdl3.py failed" }
          "SDL3_DIR=$kit" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Here a missing clang, Ninja, translator, capstone, Vulkan SDK, Dear ImGui, dav1d, libopus or SDL3 fails the tests instead of skipping them.
      # One module per process, up to four at a time, and the modules that assert a
      # wall-clock bound alone afterwards (tools/run_tests.py): the tests were nearly all
      # of the job on one core. The log ends with the usual Ran and OK lines.
      - name: Run the unit tests
        env:
          OOT2_REQUIRE_CLANG: "1"
          OOT2_REQUIRE_XLATE: "1"
          OOT2_REQUIRE_CAPSTONE: "1"
          OOT2_REQUIRE_VULKAN: "1"
          OOT2_REQUIRE_IMGUI: "1"
          OOT2_REQUIRE_DAV1D: "1"
          OOT2_REQUIRE_OPUS: "1"
          OOT2_REQUIRE_SDL3: "1"
        run: |
          clang --version
          python tools/run_tests.py
